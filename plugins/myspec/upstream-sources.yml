# Upstream sources tracked by skills/upstream-sync.
#
# Each source is an external repo we draw inspiration from. For each source,
# `last_checked_sha` is updated automatically after a successful sync run;
# `divergences` are intentional differences from upstream that must not be
# re-proposed on the next sync.
#
# To add a new source, append an entry with `last_checked_sha: ""` — the next
# sync run will treat it as a first-time pull and show full history.

sources:
  - name: superpowers
    repo: obra/superpowers
    branch: main
    last_checked_sha: "9f04f063"
    last_checked_date: "2026-05-12"
    mappings:
      - upstream: skills/brainstorming
        local: plugins/myspec/skills/brainstorm
        divergences:
          - "Output is optional (A/B/C wrap-up) — upstream mandates spec doc + writing-plans handoff."
          - "We keep SCAMPER / Six Hats / reverse-brainstorm / first-principles techniques table; upstream removed it."
          - "No HARD-GATE block — our skill is a thinking tool, not a pipeline kickoff."
          - "Frontmatter description stays exploratory; upstream uses 'You MUST use this before any creative work' trigger language."
          - "Visual-companion server ported from upstream scripts/ to lib/brainstorm-server/ (invoked via ${CLAUDE_PLUGIN_ROOT}/lib/...). Mirrored into plugins/myspec/lib/brainstorm-server/ so it resolves under the Codex plugin root too (where ${CLAUDE_PLUGIN_ROOT} → plugins/myspec/)."
          - "Server session dir + frame branding rebranded .superpowers/ → .myspec/ and 'Superpowers Brainstorming' → 'myspec Brainstorming'."
