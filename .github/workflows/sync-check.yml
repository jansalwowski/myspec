name: Plugin Tree Sync Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  sync-check:
    name: mirrored trees must match plugins/myspec/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skills mirrored (both directions)
        run: |
          status=0
          for d in skills/*/; do
            name=$(basename "$d")
            if [ ! -d "plugins/myspec/skills/$name" ]; then
              echo "::error::Skill $name exists under skills/ but not under plugins/myspec/skills/"
              status=1
            fi
          done
          for d in plugins/myspec/skills/*/; do
            name=$(basename "$d")
            if [ ! -d "skills/$name" ]; then
              echo "::error::Skill $name exists only under plugins/myspec/skills/"
              status=1
            fi
          done
          diff -r skills plugins/myspec/skills || {
            echo "::error::skills/ drifted from plugins/myspec/skills/"
            status=1
          }
          exit $status

      - name: Hooks mirrored
        run: |
          diff -r hooks plugins/myspec/hooks
          diff hooks.json plugins/myspec/hooks.json

      - name: Lib mirrored
        run: diff -r lib plugins/myspec/lib

      - name: Codex plugin manifest mirrored
        run: diff -r .codex-plugin plugins/myspec/.codex-plugin
