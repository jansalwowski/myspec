name: Issue triage

# Deterministic first pass on every new issue: area labels from the title's
# component prefix, plus status:needs-triage. On close, a parent tracker whose
# sub-issues are all closed goes back to status:needs-triage. No model call,
# so no API spend.
# The judgement (repro on main, duplicates, splits, priority) is the repo-local
# /triage skill, run by the maintainer.

on:
  issues:
    types: [opened, closed]

permissions:
  issues: write
  contents: read

jobs:
  label:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Label from title
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          EXISTING: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          labels=$(node scripts/triage/area-labels.mjs --existing "$EXISTING" "$TITLE" | paste -sd, -)
          echo "labels: ${labels:-<none>}"
          [ -z "$labels" ] || gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$labels"

  tracker:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Re-queue a parent whose sub-issues are all closed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: scripts/triage/tracker-check.sh "$NUMBER" --repo "$GITHUB_REPOSITORY"
