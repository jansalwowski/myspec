name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  suites:
    name: shell test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The liveness sweep in backbone-audit reads git history, and a
          # shallow clone makes it refuse to run rather than report.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run every suite
        run: |
          status=0
          shopt -s nullglob
          for suite in lib/tests/*.test.sh hooks/tests/*.test.sh scripts/tests/*.test.sh; do
            echo "::group::$suite"
            if bash "$suite"; then
              echo "PASS $suite"
            else
              echo "::error file=$suite::$suite failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

  js-lint:
    name: eslint on shipped JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pinned versions live in the script; it covers lib/.
      - name: eslint:recommended on lib/
        run: scripts/lint-js.sh

  shellcheck:
    name: shellcheck on shipped shell
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: v0.10.0
      SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
    steps:
      - uses: actions/checkout@v4

      # Pinned and checksummed rather than the runner's apt shellcheck, whose
      # version moves with the image and would change findings under us.
      - name: Install pinned ShellCheck
        run: |
          tarball="shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$tarball"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          echo "SHELLCHECK=$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION/shellcheck" >> "$GITHUB_ENV"

      # Covers hooks/ and lib/, tests included.
      - name: ShellCheck hooks/ and lib/
        run: scripts/lint-sh.sh

  stack-agnostic:
    name: no localhost ports in skills or examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for concrete localhost:<port> addresses
        run: scripts/check-no-localhost-ports.sh

  skill-lint:
    name: skill lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint every SKILL.md
        run: |
          node scripts/lint-skills.mjs

      - name: Hook scripts parse (bash -n)
        run: |
          status=0
          for f in hooks/*.sh hooks/*/*.sh .githooks/* scripts/*.sh; do
            [ -f "$f" ] || continue
            head -n1 "$f" | grep -qE '^#!.*[/ ](ba)?sh( |$)' || continue
            bash -n "$f" || { echo "::error file=$f::bash -n failed"; status=1; }
          done
          exit $status
