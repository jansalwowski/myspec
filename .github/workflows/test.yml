name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  suites:
    name: shell test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The liveness sweep in backbone-audit reads git history, and a
          # shallow clone makes it refuse to run rather than report.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: TEMPORARY — diagnose branch-cleanup on Linux
        run: |
          git --version; bash --version | head -1; jq --version || true
          # The suite discards the script's stderr, which is why CI shows only
          # `got=<none>`. Unmask it for this one run.
          sed -i 's|--json 2>/dev/null)|--json)|' lib/tests/branch-cleanup.test.sh
          DEBUG_VERDICTS=1 bash lib/tests/branch-cleanup.test.sh 2>&1 | head -60 || true
          git checkout -- lib/tests/branch-cleanup.test.sh

      - name: Run every suite
        run: |
          status=0
          shopt -s nullglob
          for suite in lib/tests/*.test.sh hooks/tests/*.test.sh; do
            echo "::group::$suite"
            if bash "$suite"; then
              echo "PASS $suite"
            else
              echo "::error file=$suite::$suite failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
