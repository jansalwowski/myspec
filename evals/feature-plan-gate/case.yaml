    # Work Isolation

    Before the first source edit, the user picks `develop` (edit this checkout) or `Worktree` (linked worktree, PR at the end); never pick for them. `require-isolation-decision.sh` and `guard-worktree-context.sh` enforce it. A block message says what to do next; the full procedure is `.ai/work-isolation.md`.

    Your session id comes only from a block message. Never take one from `.claude/state/sessions/`: every session has a file there.

    Contents of .claude/rules/workflow.md (project instructions, checked into the codebase):

    # AI-First Development Workflow

    **Documentation is the source of truth.** This project is developed using AI.

    ## Code Generation Policy

    Any source-code change — new files, modifications, components/functions/modules, anything outside `.ai/` and `docs/` — requires explicit user instruction ("implement this", "write the code", "create the file", "make these changes"). Reading, analyzing, planning, and editing documentation under `.ai/` or `docs/` never require permission.

    ## Feature Pipelines

    - **New feature:** `feature-spec` → `feature-spec-review` → `feature-tech-spec` → `feature-tech-spec-review` → `feature-plan` → `feature-implement` → `feature-complete`
    - **Modification:** `feature-update` → `feature-plan` → `feature-implement` → `feature-complete`
    - **Optional:** `feature-decompose` (feature too large for one tech-spec), `cross-spec-validation` (after spec approval or updates), `feature-mockup` → `feature-mockup-review` (visual spec validation before tech design; `/myspec:setup mockup` configures), `feature-spec {feature} scenarios|seed-data`

    All are `/myspec:*` skills; each skill's own description covers when to invoke it.

    ## Feature Documentation Structure

    | File | Phase | Purpose |
    |------|-------|---------|
    | `spec.md` | 1 | Product specification (what & why) — REQUIRED |
    | `dependencies.md` | 1 | Cross-feature dependency map — REQUIRED |
    | `tech-spec.md` | 2 | Implementation specification (how) |
    | `scenarios.md` | 1 | Test scenarios in Gherkin format (optional) |
    | `seed.json` | 1 | Test seed data (optional) |
    | `plans/` | 5 | Archived implementation plans (moved here on feature-complete) |
    | `CHANGELOG.md` | 5 | Feature evolution history — one entry per archived plan |

    ## Status State Machine

    Two status vocabularies exist; do not mix them.

    - **Doc status** (`status:` in spec.md / tech-spec.md frontmatter): `draft | approved | deprecated`. The review skills flip `draft → approved` on pass (no Critical/High findings) with user confirmation; `feature-update` flips `approved → draft`; deprecation is manual or via `cross-spec-validation`.
    - **Manifest status** (per-feature `status:` in `.ai/features/index.yaml` — the single source of truth for progress): `planned | draft | in-progress | complete | deprecated`. `feature-spec` and `idea-process` create `draft`; `feature-implement` flips `draft → in-progress` at execution start; `feature-complete` flips `in-progress → complete` only when the plan's checkboxes are all `[x]` or remaining tasks are explicitly deferred; `planned` and `deprecated` are set by hand.
    - **Manifest `note:`**: one line, ≤150 chars, current state only (e.g. a deferral pointer). Replace, never append. History goes to `CHANGELOG.md`; never PR state or SHAs.

    Completion percentage comes from **implementation-plan.md checkboxes**, never from tech-spec checkboxes or code inspection. Per-status doc expectations are codified in `/myspec:feature-status-audit` — treat its matrix as authoritative.

    ## Sub-Feature Convention

    The top-level manifest holds main features only. A feature flagged `subfeatures: true` there has a dedicated `{feature}/index.yaml` whose list key is `sub-features:` — the only two spellings.

    ## Documentation Requirements

    New feature → `.ai/features/{feature}/`; feature changes → update the same directory; architecture decisions → `.ai/decisions/`; a new app, package, or top-level command → the topology file named in `.myspec.json` (`/myspec:backbone-sync` audits it). Every markdown file under `.ai/` carries YAML frontmatter — enforced by the `validate-frontmatter.sh` PreToolUse hook (`.ai/ideas/` exempt).
