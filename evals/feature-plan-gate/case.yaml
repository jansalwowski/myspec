    Contents of .claude/rules/auto-memory-style.md (project instructions, checked into the codebase):

    # Auto-Memory Style Guide

    Governs entries in the harness-managed user-level auto-memory store at `~/.claude-personal/projects/<encoded_cwd>/memory/`. Project-level myspec memory under `.ai/memory/` is out of scope — it has its own typed templates and `.claude/rules/memory-system.md`.

    The lesson is the **rule** plus the **trigger** plus the **minimal pattern**; everything else is a token tax paid on every recall. The budget applies at creation time and during `/myspec:memory-sanitize` COMPRESS passes.

    ## Length budget

    | Type | Body target | Hard cap |
    |------|-------------|----------|
    | feedback | ≤ 12 lines | 20 |
    | project | ≤ 15 lines | 25 |
    | semantic | ≤ 8 lines | 15 |
    | reference | ≤ 6 lines | 10 |

    Index lines in `MEMORY.md`: ≤ 150 characters.

    **Keep:** the rule (1 line); the trigger or detection cue (1–2); why, only when non-obvious (1); how to apply — minimal pattern, signature, or command (1–3); the caveat docs will not tell you (1–2). At most one code block, ≤ 6 lines, no imports or boilerplate.

    **Cut:** the originating incident (the seed, not the lesson); full code blocks where a one-liner suffices; "where applied: file:line, PR #X" (rots — `grep` finds usage); restatements; date-bound references and SHAs.

    ## Before writing (ADD / UPDATE / NO-OP)

    Scan `MEMORY.md` hooks for keyword overlap with the planned entry and read each hit. **NO-OP** when one already covers it — say "Already covered by `{file}` — open it?" and write nothing. **UPDATE** when one is close but missing this nuance — propose a verbatim diff to that file, never a new one. **ADD** only when truly novel. Append-style growth is the bloat path.

    ## Conflicts

    When two kept memories contradict, newer wins: the older gets `status: superseded` in its frontmatter and a one-line body `Superseded by [{survivor}](./{survivor}).`, leaves `MEMORY.md`, and stays on disk as an audit trail.

    Contents of .claude/rules/memory-system.md (project instructions, checked into the codebase):

    # Agent Memory System

    Governs the project-level memory under `.ai/memory/`. User-level auto-memory: `.claude/rules/auto-memory-style.md`. Always loaded, so it holds only triggers and contracts; procedures are in the skills, protocols in `.ai/pre-flight.md`.

    ## Triggers

    | When | Action |
    |------|--------|
    | Session start | `/myspec:bootstrap` — Layer 1, memory health, session sweep; Layer 2 only when given a task |
    | Before significant work (new feature, multi-file change, debugging) | `/myspec:memory-preflight`, unless bootstrap already scanned Layer 2 for this task |
    | Before trivial work (single-file fix, typo, config) | Read `.ai/memory/index.md` only |
    | First code edit | Automatic — `mark-code-changed.sh` creates `.claude/state/sessions/{session_id}.md`, shared with subagents, and appends every code path to its `## Files touched` — Bash writes included |
    | Non-code session (debugging without edits, discovery, doc-only) | `/myspec:session-start` |
    | Repeated failure — same file edited 3+ times, same error after 2 different fixes, about to retry a failed approach | `/myspec:memory-lookup`, then pause and ask the user. Protocol and message template: `.ai/pre-flight.md` |
    | Debugging an unfamiliar error | `/myspec:memory-lookup` |
    | Work complete | `/myspec:session-complete` — extraction plus archive of your own session file only |
    | User says "remember / note / keep in mind …" | Project fact (environment, gotcha, decision, convention) → `/myspec:memorize`, not auto-memory. Personal preference (style, role) → auto-memory. `/memorize` always wins |
    | User approves a memory | `/myspec:memory-create` |
    | Allocating a memory ID | `/myspec:memory-create` claims it (`memory-claim-id.sh`) — never read the index and pick a number; parallel sessions pick the same one. Exit 3 → fix the conformance errors it printed |
    | After adding, removing, or superseding a memory | The skill that edited it regenerates the tables (`/myspec:memory-create`, `/myspec:memory-optimize`); never hand-write an index row. On an `index.md` merge conflict keep either side and regenerate |
    | Memory drift suspected | `/myspec:memory-optimize` — runs the doctor, which reports each disagreement and its fix |
    | Before reporting anything as done | Run the check and read the output first; "should work" is not a result |

    ## Budgets

    | Layer | Loaded | Budget | Where |
    |-------|--------|--------|-------|
    | 1 | Always | ~200 tokens | `.ai/memory/index.md` — critical anti-patterns, one line per type index |
    | 2 | Per task | ~500 tokens per index | `.ai/memory/{procedural,semantic,episodic}/index.md` |
    | 3 | On demand | Unlimited | Individual memory files, `.ai/memory/sessions/archive/` |

    Episodic memories older than 30 days consolidate into semantic facts; `/myspec:memory-preflight` flags the candidates.

    ## Session lifecycle

    | Aspect | Convention |
    |--------|-----------|
    | Live file | `.claude/state/sessions/{session_id}.md` in the **main checkout** of the repo the edited file belongs to — gitignored, never inside a linked worktree (where `git worktree remove` destroys it) |
    | Own session | The live file whose `## Files touched` lists a path you edited untagged, or tags your subagent; several or none → newest mtime, and confirm. You never see your session id; never pass this one to `set-isolation.sh` |
    | Archive file | `.ai/memory/sessions/archive/YYYY-MM-DD-{slug}.md`; topic-less sweeps use `orphaned-{first 8 of session_id}` |
    | Terminal statuses | `completed` (via `/myspec:session-complete`) or `abandoned` (swept). Archive is a location, not a status |
    | Age policy | mtime < 1h: live, never touch. 1–6h: ambiguous, route to `/myspec:session-clean`. > 6h: sweep as `abandoned` |
    | Ownership | Own → `/myspec:session-complete`; others' → `/myspec:session-clean` or bootstrap's > 6h sweep |

