    # Agent Memory System

    Governs the project-level memory under `.ai/memory/`. Procedures are in the skills, protocols in `.ai/pre-flight.md`. User-level auto-memory: the last section.

    ## Triggers

    | When | Action |
    |------|--------|
    | Session start | `/myspec:bootstrap` — Layer 1, memory health, session count; Layer 2 only when given a task |
    | Before work | Significant (new feature, multi-file change, debugging): `/myspec:memory-preflight`, unless bootstrap already scanned Layer 2 for this task. Trivial (single-file fix, typo, config): read `.ai/memory/index.md` only |
    | First code edit | Automatic — `mark-code-changed.sh` appends every code path, Bash writes included, to `## Files touched` in `.claude/state/sessions/{session_id}.md`, shared with subagents |
    | Non-code session (debugging without edits, discovery, doc-only) | `/myspec:session-start` |
    | Repeated failure — same file edited 3+ times, same error after 2 different fixes, about to retry a failed approach (full list: `.ai/pre-flight.md`) | `/myspec:memory-lookup`, then pause and ask the user |
    | Debugging an unfamiliar error | `/myspec:memory-lookup` |
    | Work complete | `/myspec:session-complete` — extraction plus archive of your own session file only |
    | User says "remember / note / keep in mind …" | Project fact (environment, gotcha, decision, convention) → `/myspec:memorize`, not auto-memory. Personal preference (style, role) → auto-memory. `/memorize` always wins |
    | User approves a memory | `/myspec:memory-create` |
    | Allocating a memory ID | `/myspec:memory-create` claims it (`memory-claim-id.sh`) — never pick a number from the index; parallel sessions collide. Exit 3 → fix the conformance errors it printed |
    | After adding, removing, or superseding a memory | The skill that edited it regenerates the tables (`/myspec:memory-create`, `/myspec:memory-optimize`); never hand-write an index row. On an `index.md` merge conflict keep either side and regenerate |
    | Memory drift suspected | `/myspec:memory-optimize` — runs the doctor, which reports each disagreement and its fix |

    ## Session lifecycle

    | Aspect | Convention |
    |--------|-----------|
    | Live file | `.claude/state/sessions/{session_id}.md` in the edited file's **main checkout** — gitignored, never in a linked worktree (`git worktree remove` would destroy it) |
    | Own session | The live file whose `## Files touched` lists a path you edited untagged, or tags your subagent; several or none → newest mtime, and confirm |
    | Archive file | `.ai/memory/sessions/archive/YYYY-MM-DD-{slug}.md` in the main checkout |
    | Terminal statuses | `completed` (via `/myspec:session-complete`) or `abandoned` (swept by `/myspec:session-clean`). Archive is a location, not a status |
    | Ownership | Own → `/myspec:session-complete`. Others' → `/myspec:session-clean`, which owns the age policy; never touch them outside it |

    ## User-level auto-memory

    The harness store at `<config_dir>/projects/<encoded_cwd>/memory/` (`$CLAUDE_CONFIG_DIR`, default `~/.claude`). Before writing an entry, scan `MEMORY.md` hooks for overlap: **NO-OP** when one already covers it, **UPDATE** that file when one is close, **ADD** only when novel. Body lines, target/cap: feedback 12/20, project 15/25, semantic 8/15, reference 6/10; `MEMORY.md` lines ≤ 150 characters. What to keep and cut, and conflicts: `.ai/auto-memory-style.md`.

    Contents of .claude/rules/work-isolation.md (project instructions, checked into the codebase):

    # Work Isolation

    Before the first source edit (any edit on the default branch, a detached HEAD, or an `isolation.protectedBranches` branch), the user picks `develop` (edit this checkout) or `Worktree` (linked worktree, PR at the end); never pick for them. `require-isolation-decision.sh` and `guard-worktree-context.sh` enforce it. A block message says what to do next; the full procedure is `.ai/work-isolation.md`. Never write files through an interpreter one-liner: the hooks cannot see it.

    Your session id comes only from a block message. Never take one from `.claude/state/sessions/`: every session has a file there.

    Contents of .claude/rules/workflow.md (project instructions, checked into the codebase):

    # AI-First Development Workflow

    **Documentation is the source of truth.** This project is developed using AI.

    ## Code Generation Policy

    Any source-code change — new files, modifications, components/functions/modules, anything outside `.ai/` and `docs/` — requires explicit user instruction ("implement this", "write the code", "create the file", "make these changes"). Reading, analyzing, planning, and editing documentation under `.ai/` or `docs/` never require permission.

    ## Feature Pipelines

    All are `/myspec:*` skills.

    - **New feature:** `feature-spec` → `feature-spec-review` → `feature-tech-spec` → `feature-tech-spec-review` → `feature-plan` → `feature-implement` → `feature-complete`
    - **Modification:** `feature-update` → `feature-plan` → `feature-implement` → `feature-complete`

    ## Documentation Requirements

    New feature → `.ai/features/{feature}/` (layout and status rules: `.claude/rules/feature-docs.md`, loaded with those files); feature changes → update the same directory; architecture decisions → `.ai/decisions/`; a new app, package, or top-level command → the topology file named in `.myspec.json` (`/myspec:backbone-sync` audits it). Every markdown file under `.ai/` carries YAML frontmatter — enforced by the `validate-frontmatter.sh` PreToolUse hook (`.ai/ideas/` exempt).
