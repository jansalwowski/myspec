# Upstream sources tracked by the repo-local .claude/skills/upstream-sync skill.
#
# Each source is an external repo we draw inspiration from. For each source,
# `last_checked_sha` is updated automatically after a successful sync run;
# `divergences` are intentional differences from upstream that must not be
# re-proposed on the next sync.
#
# To add a new source, append an entry with `last_checked_sha: ""` — the next
# sync run will treat it as a first-time pull and show full history.

sources:
  - name: superpowers
    repo: obra/superpowers
    branch: main
    last_checked_sha: "bb92a777"
    last_checked_date: "2026-10-12"
    mappings:
      - upstream: skills/brainstorming
        local: skills/brainstorm
        divergences:
          - "Output is optional (A/B/C wrap-up) — upstream mandates spec doc + writing-plans handoff."
          - "We keep SCAMPER / Six Hats / reverse-brainstorm / first-principles techniques table; upstream removed it."
          - "No HARD-GATE block — our skill is a thinking tool, not a pipeline kickoff."
          - "Frontmatter description stays exploratory; upstream uses 'You MUST use this before any creative work' trigger language."
          - "Visual-companion server ported from upstream scripts/ to lib/brainstorm-server/ (invoked via ${CLAUDE_PLUGIN_ROOT}/lib/...)."
          - "Server session dir + frame branding rebranded .superpowers/ → .myspec/ and 'Superpowers Brainstorming' → 'myspec Brainstorming'."
          - "Three-path router (spike/bounded/architectural), reworked HARD-GATE, Red Flags table, per-path checklists, dot graph (v6.3.0) not adopted — machinery for scaling a mandatory spec pipeline we do not have; only the one-way depth ratchet was folded into Before-diving-in."
          - "spec-document-reviewer-prompt.md deleted locally — unreferenced dead file in both trees (upstream flow switched to inline self-review; ours always was)."
          - "visual-companion.md platform-launch matrix trimmed to Claude Code + Windows + generic fallback; the Codex (with its CODEX_CI auto-foreground in start-server.sh), Gemini and Copilot CLI sections not mirrored."
          - "Alpine.js vendored into the companion (open upstream PR #1639) not adopted: a vendored browser library for interactive mockups; decision screens (Submit -> state/answer.json, used by visualize-options) cover what we need without one."
          - "Decision screens are local: data-question/data-choice/data-submit wiring in helper.js, answer.json in server.cjs, their CSS in frame-template.html. Upstream has no Submit."
          - "Adopted ahead of upstream merge: start-server.sh valueless-option guard (PR #2444) and BRAINSTORM_OPEN_CMD via execFile (PR #1964). Upstream tests ported to lib/tests/brainstorm-server/ without the ws dependency."
          - "Prime Radiant branding, telemetry env vars, remote logo, and version readout stripped from server.cjs; the BRANDING slot renders a static myspec link. Upstream start-server.sh kill-any-existing-server block stays removed (dead code — SESSION_DIR is unique per run)."
